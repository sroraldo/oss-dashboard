name: Update download stats

on:
  schedule:
    - cron: "17 0 * * *"   # every day at 00:17 UTC (8:17 AM Philippine time)
  workflow_dispatch:         # adds a "Run workflow" button for running it by hand

permissions:
  contents: write            # lets the action save the updated index.html

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch download stats
        run: python fetch_stats.py iloveitaly --no-open

      - name: Save the updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Update download stats"
          git push
