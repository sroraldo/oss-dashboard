<body class="bg-gray-100 min-h-screen font-sans">
    <div class="max-w-6xl mx-auto py-10 px-4">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">OSS Cross-Ecosystem User Dashboard</h1>
        <p class="text-center text-gray-500 mb-8" id="subtitle"></p>

        <div id="missing" hidden class="bg-yellow-50 border border-yellow-300 text-yellow-800 px-5 py-4 rounded mb-8">
            <p class="font-semibold mb-1">No stats yet.</p>
            <p class="text-sm">Put <code class="bg-yellow-100 px-1 rounded">fetch_stats.py</code> in the same folder as this file and run
                <code class="bg-yellow-100 px-1 rounded">python fetch_stats.py iloveitaly</code>. It fills in this page and opens it.</p>
        </div>

        <div id="results" hidden class="space-y-6">
            <div class="bg-white rounded-lg shadow-md p-6 text-center border-t-4 border-gray-800">
                <h2 class="text-xl font-semibold text-gray-700 mb-2">Combined Downloads</h2>
                <p class="text-5xl font-bold text-gray-800" id="grand-total">0</p>
                <p class="text-xs text-gray-500 mt-2" id="grand-note"></p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="cards"></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="tables"></div>
        </div>
    </div>

    <script>
        const SOURCES = [
            { key: 'npm',    title: 'npm',        period: 'All Time',   unit: 'packages', color: 'red',    col: 'All Time', monthCol: true },
            { key: 'pypi',   title: 'PyPI',       period: 'All Time',   unit: 'packages', color: 'yellow', col: 'All Time', monthCol: true },
            { key: 'docker', title: 'Docker Hub', period: 'All Time',   unit: 'images',   color: 'blue',   col: 'Total Pulls' },
            { key: 'ghcr',   title: 'GHCR',       period: 'All Time',   unit: 'images',   color: 'purple', col: 'Total Downloads' },
        ];

        const fmt = (n) => (n || 0).toLocaleString();
        const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        const S = window.STATS;
        if (!S) {
            document.getElementById("missing").hidden = false;
        } else {
            document.getElementById('subtitle').textContent =
                `${S.username} · updated ${new Date(S.updated).toLocaleString()}`;
            document.getElementById('grand-total').textContent = fmt(S.grand_total);
            document.getElementById('grand-note').textContent = SOURCES
                .map(src => `${src.title} ${((S[src.key] && S[src.key].period) || src.period).toLowerCase()}`)
                .join(' + ');

            const cards = document.getElementById('cards');
            const tables = document.getElementById('tables');

            for (const src of SOURCES) {
                const d = S[src.key] || { ok: false, error: 'missing from stats', packages: [], total: 0 };

                const status = d.ok
                    ? `<p class="text-xs mt-2 text-green-700">✓ ${esc(d.source)}</p>`
                    : `<p class="text-xs mt-2 text-red-600 break-words" title="${esc(d.error)}">✗ Failed: ${esc(d.error.slice(0, 160))}</p>`;
                // Show a separate "last 30 days" number only when the main number covers a longer period
                const showMonth = src.monthCol && d.ok && (d.period || src.period) !== 'Last 30 Days' && (d.period || src.period) !== 'Last Month';
                const month = showMonth
                    ? `<p class="text-xs text-gray-400 mt-1">${fmt(d.last_30)} in the last 30 days</p>` : '';

                cards.insertAdjacentHTML('beforeend', `
                    <div class="bg-white rounded-lg shadow-md p-6 text-center border-t-4 border-${src.color}-500">
                        <h2 class="text-lg font-semibold text-gray-700 mb-2">${src.title} (${d.period || src.period})</h2>
                        <p class="text-3xl font-bold text-${src.color}-600">${fmt(d.total)}</p>
                        <p class="text-sm text-gray-500 mt-1">${d.packages.length} ${src.unit}</p>
                        ${month}${status}
                    </div>`);

                const rows = d.packages.length
                    ? d.packages.map(p => `
                        <tr class="border-b">
                            <td class="px-4 py-2 font-medium text-gray-900">${esc(p.name)}</td>
                            <td class="px-4 py-2 text-right">${fmt(p.downloads)}</td>
                            ${showMonth ? `<td class="px-4 py-2 text-right">${fmt(p.last_30)}</td>` : ''}
                        </tr>`).join('')
                    : `<tr><td colspan="3" class="px-4 py-2 text-center text-gray-500">No ${src.unit} found</td></tr>`;

                tables.insertAdjacentHTML('beforeend', `
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <h3 class="text-lg font-medium text-gray-700 mb-4">Top ${src.title} ${src.unit === 'images' ? 'Images' : 'Packages'}</h3>
                        <div class="overflow-y-auto max-h-64">
                            <table class="min-w-full text-sm text-left text-gray-500">
                                <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                                    <tr>
                                        <th class="px-4 py-2">${src.unit === 'images' ? 'Image' : 'Package'}</th>
                                        <th class="px-4 py-2 text-right">${src.monthCol && d.period ? d.period : src.col}</th>
                                        ${showMonth ? '<th class="px-4 py-2 text-right">Last 30 Days</th>' : ''}
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </div>`);
            }
            document.getElementById("results").hidden = false;
        }
    </script>
</body>
